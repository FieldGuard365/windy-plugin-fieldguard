name: Publish Plugin
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: Publish Plugin
        run: npx @windycom/plugin-devtools publish
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
